<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal family view</title><style>body{background:#17231f;color:white;font:17px system-ui;max-width:35rem;margin:2rem auto;padding:1rem}a{display:block;color:white;background:#304a3b;border:1px solid #ffffff80;border-radius:9px;padding:16px;margin:10px 0;text-align:center;text-decoration:none}</style><h1>Roman Llandeilo · Family view</h1><p>Choose a portal. Allow motion to look around by moving your phone, or use your finger if you prefer. Tap Clean screen for an unobstructed view, and Show controls to bring the buttons back.</p><a data-portal="true" href="vicus-family-direct.html">Vicus</a><a data-portal="true" href="east-gate-family-direct.html">East Gate</a><a data-portal="true" href="principia-family-direct.html">Principia</a><a data-portal="true" href="west-gate-family-direct.html">West Gate</a><script>async function choosePortal(e){const a=e.target.closest('a[data-portal]');if(!a)return;e.preventDefault();let result='denied';try{if(typeof DeviceOrientationEvent!=='undefined'){result=typeof DeviceOrientationEvent.requestPermission==='function'?await DeviceOrientationEvent.requestPermission():'granted';}}catch(err){}try{sessionStorage.setItem('family-motion-choice',result);}catch(err){}location.href=a.href;}document.addEventListener('click',choosePortal);</script></html>
