<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android motion diagnostic</title><style>body{background:#17231f;color:white;font:18px system-ui;padding:20px}button{font:inherit;padding:14px}pre{font-size:17px;white-space:pre-wrap;background:#304a3b;padding:15px;border-radius:8px}</style><h2>Android Motion Diagnostic</h2><p>Hold phone upright. Turn your whole body 90° left or right. Do the numbers change?</p><button id="start">Start sensors</button><pre id="out">Waiting for sensor readings…</pre><script>let count=0,last=null;function update(e){last=e;count++;const a=screen.orientation?.angle??window.orientation??0;document.getElementById('out').textContent='Events: '+count+'\nScreen angle: '+a+'\nalpha: '+String(e.alpha)+'\nbeta: '+String(e.beta)+'\ngamma: '+String(e.gamma)+'\nabsolute: '+String(e.absolute)+'\nwebkitCompassHeading: '+String(e.webkitCompassHeading);};document.getElementById('start').onclick=async()=>{try{if(typeof DeviceOrientationEvent.requestPermission==='function'){const x=await DeviceOrientationEvent.requestPermission();if(x!=='granted'){document.getElementById('out').textContent='Permission: '+x;return}}window.addEventListener('deviceorientation',update);document.getElementById('out').textContent='Listening…';}catch(e){document.getElementById('out').textContent='Error: '+e.message;}};</script></html>
