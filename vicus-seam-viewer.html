<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vicus seam test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1c2420;color:white;font:16px system-ui}canvas{display:block;width:100%;height:100dvh;touch-action:none}nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}button,output{color:white;background:#17231fed;border:1px solid #ffffff60;border-radius:8px;padding:10px;font:inherit}output{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;width:fit-content}output:empty{display:none}
</style>
<canvas aria-label="Vicus panorama. Drag to look around."></canvas>
<output role="status">Loading panorama…</output>
<nav><button id="reset">Face the join</button><button id="motion">Use phone motion</button></nav>
<script>
const canvas=document.querySelector('canvas'),status=document.querySelector('output');
const motion=document.querySelector('#motion');
const gl=canvas.getContext('webgl',{alpha:false});
let yaw=Math.PI,pitch=-.06,tracking=false,heading=null,tilt=null,drag=null;
const clampPitch=value=>Math.max(-1.48,Math.min(1.48,value));

function setup(){
 if(!gl)throw Error('This browser could not start the 360 viewer.');
 function shader(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error('The panorama shader could not start.');
  return shader;
 }
 const program=gl.createProgram();
 gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 position; varying vec2 point; void main(){point=position;gl_Position=vec4(position,0.,1.);}'));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`
 precision mediump float;
 varying vec2 point;
 uniform sampler2D pano;
 uniform vec2 viewScale, angle;
 void main(){
  vec3 r=normalize(vec3(point*viewScale,1.));
  float cp=cos(angle.y),sp=sin(angle.y);
  r=vec3(r.x,r.y*cp+r.z*sp,r.z*cp-r.y*sp);
  float cy=cos(angle.x),sy=sin(angle.x);
  r=vec3(r.x*cy+r.z*sy,r.y,r.z*cy-r.x*sy);
  vec2 uv=vec2(fract(.5+atan(r.x,r.z)/6.2831853),.5-asin(clamp(r.y,-1.,1.))/3.14159265);
  gl_FragColor=texture2D(pano,uv);
 }`));
 gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('The 360 viewer could not start.');
 gl.useProgram(program);
 const quad=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,quad);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 const position=gl.getAttribLocation(program,'position');
 gl.enableVertexAttribArray(position);
 gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
 const tex=gl.createTexture();
 gl.bindTexture(gl.TEXTURE_2D,tex);
 for(const key of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,key,gl.LINEAR);
 for(const key of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,key,gl.CLAMP_TO_EDGE);
 const angle=gl.getUniformLocation(program,'angle'),scale=gl.getUniformLocation(program,'viewScale');
 const image=new Image();
 image.onload=()=>{
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);
  status.textContent='';
  function draw(){
   const density=Math.min(devicePixelRatio||1,2);
   const w=Math.round(canvas.clientWidth*density),h=Math.round(canvas.clientHeight*density);
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
   const x=w/h;
   gl.uniform2f(scale,x<1?.45:.45*x,x<1?.45/x:.45);
   gl.uniform2f(angle,yaw,pitch);
   gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
   requestAnimationFrame(draw);
  }
  draw();
 };
 image.onerror=()=>status.textContent='The panorama could not load. Refresh to try again.';
 image.src='vicus-seam-repaired.jpg';
}
try{setup();}catch(error){status.textContent=error.message;}
function stopMotion(){tracking=false;heading=null;tilt=null;motion.textContent='Use phone motion';}
canvas.onpointerdown=e=>{stopMotion();drag=e;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;yaw-=(e.clientX-drag.clientX)*.004;pitch=clampPitch(pitch+(e.clientY-drag.clientY)*.004);drag=e;};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};
document.querySelector('#reset').onclick=()=>{yaw=Math.PI;pitch=-.06;heading=null;tilt=null;};
motion.onclick=async()=>{
 if(tracking){stopMotion();return;}
 const sensor=window.DeviceOrientationEvent;
 try{
  if(!sensor||(sensor.requestPermission&&await sensor.requestPermission()!=='granted'))throw Error();
  tracking=true;motion.textContent='Use finger drag';status.textContent='';
 }catch{status.textContent='Motion is unavailable. Drag the panorama to look around.';}
};
window.addEventListener('deviceorientation',e=>{
 if(!tracking||!Number.isFinite(e.alpha)||!Number.isFinite(e.beta))return;
 const nextHeading=Number.isFinite(e.webkitCompassHeading)?e.webkitCompassHeading:-e.alpha;
 if(heading!==null)yaw+=(((nextHeading-heading+540)%360)-180)*Math.PI/180;
 if(tilt!==null)pitch=clampPitch(pitch+(e.beta-tilt)*Math.PI/180);
 heading=nextHeading;tilt=e.beta;
});
</script>
</html>
